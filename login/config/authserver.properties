# ================================================================
# Auth Server Configuration
# ================================================================
# External Connection Address
# The host and port for client connections (Physical Ethernet address)
LoginserverHostname = *
LoginserverPort = 2106

# Internal Login server communication address with game server or External if the game server is on another physical server
# The host and port for game servers
LoginHost = 127.0.0.1
LoginPort = 9014

# Take a new game server into a free slot (auto parking game server to auth server)
AcceptNewGameServer = True

# ================================================================
# Database Setting
# ================================================================
# Database Host
DatabaseHost = 127.0.0.1
# Database Port
DatabasePort = 3306
# Database Name
DatabaseName = l2j
# Database User
DatabaseUser = root
# Database Password
# Coloque aqui a senha do SEU banco. Nao suba a senha real para o GitHub (este arquivo e publico).
DatabasePassword = 
# Database max connections (This value does not make sense to expand, if you use direct connection from web server - can add 5-10 pools)
DatabaseMaxConnections = 8
# DB connection timeout
DatabaseConnectionTimeout = 30
# DB additional properties (empty by default)
DatabaseExProperties =
# System of automatic updating of the database structure and its creation in the absence
DatabaseStructureManager = True
# System for automatic creation of a database backup
# Example: * - all tables.
# For individual tables, list like: DatabaseDumpTables = account_log, accounts, gameservers, and etc.
DatabaseDumpTables = *
# Format and directory of SQL dump
DatabaseDumpFilenameFormat = backup/%table_name%_%date%_%time%.sql
# Format and directory of zip dump file
DatabaseDumpZipOutFilenameFormat = backup/%date%_%time%.zip
# ================================================================

# Automatic creation of accounts
# True: quem logar com um nome que nao existe ganha a conta na hora (pratico em teste).
# Servidor publico: o comum e False e criar as contas pelo site/cadastro.
AutoCreateAccounts = True
# Template for login and password (The game client supports a maximum of 14 characters. You can not put more)
AccountTemplate = [A-Za-z0-9]{4,14}
# Senha minima de 6 caracteres (vale so para contas novas; as existentes continuam entrando)
PasswordTemplate = [A-Za-z0-9]{6,16}
# Password Encryption Method
# recommended encryption whirlpool2 / Current cache is recommended whirlpool 2
PasswordHash = whirlpool2
# Supported outdated methods, example sha1 (l2jserver)
LegacyPasswordHash = sha1

# Key cache size
BlowFishKeys = 20
RSAKeyPairs = 10

# Banned IP list
BlackIpList = 
# Autoban IP - The number of failed logins count, to ban IP
LoginTryBeforeBan = 10
# Allowable minimum time between the authorization from one IP (in seconds)
LoginTryTimeout = 5
# Time to ban IP, if exceeded the number of failed logins (seconds)
# (usado so se IpBanSteps estiver vazio)
IpBanTime = 300
# White ip list. This IPs will NEVER be banned.
WhiteIpList = 127.0.0.1

#-------------------------------------------------------------
# Protecao contra abuso (LoginGuard)
# Tudo daqui e de cima (contas, tentativas, listas de IP) pode ser recarregado sem
# reiniciar pelo botao "Recarregar protecao" da janela do login.
#-------------------------------------------------------------
# Mais que ConnectionFloodMax conexoes do mesmo IP em ConnectionFloodWindow segundos = ban
# (0 desliga o limite)
ConnectionFloodMax = 15
ConnectionFloodWindow = 10
# Duracao dos bans em segundos, por reincidencia: 1o ban, 2o, 3o... (o ultimo vale para os seguintes)
# Vale para senha errada (LoginTryBeforeBan), conta inexistente e excesso de conexoes.
IpBanSteps = 300,3600,86400
# Horas sem novo ban para o IP voltar ao primeiro nivel
IpBanResetHours = 24
# 127.x e IPs da rede local (10.x, 172.16-31.x, 192.168.x) nunca sao banidos
TrustLocalNetwork = True
# Salva os bans no banco (tabela login_ip_bans, criada sozinha): continuam valendo depois de reiniciar
PersistIpBans = True

#-------------------------------------------------------------
# Mensagens para o jogador (caixinha da tela de login)
# O login do Interlude so manda um NUMERO; o texto vem do systemmsg-e.dat do cliente.
# Senha errada (3) e conta banida usam sempre as mensagens originais do jogo.
#-------------------------------------------------------------
# Pacote das mensagens proprias (bloqueio de IP, ultima tentativa, senha/nome invalido):
#   LoginFail     = numeros 1 a 22, os mesmos de mensagens originais (padrao).
#   AccountKicked = motivos 0, 1, 3, 4, 8, 16, 64, que outros servidores nao usam. Com a interface
#                   (TrueWnd.uc) trocando esses textos pelas mensagens novas, em outro servidor
#                   aparecem sempre as mensagens originais.
LoginMsgPacket = LoginFail
# IP bloqueado: um numero por nivel de IpBanSteps (1o ban, 2o, 3o...; o ultimo vale para os seguintes).
# Ex.: com IpBanSteps = 300,3600,86400: LoginMsgIpBanned = 17,18,19
LoginMsgIpBanned = 21
# Senha errada quando a proxima errada vai bloquear o IP
LoginMsgLastAttempt = 3
# Criacao automatica: senha fora do PasswordTemplate (curta, simbolos...)
LoginMsgInvalidPassword = 5
# Criacao automatica: nome de conta fora do AccountTemplate
LoginMsgInvalidAccountName = 5
# Conta banida (accesslevel negativo ou ban com prazo). Sempre pelo LoginFail.
LoginMsgAccountBanned = 21
# Conta de teste: entrar com este nome e a senha = numero (ex.: 17) mostra a mensagem desse numero,
# pelo pacote de LoginMsgPacket. Nao conta tentativa nem bane. Deixe vazio para desligar.
LoginMsgTestAccount =
# ===============================================================
# Configuring HaProxy v2
# ===============================================================
# Specifies the IP address of the physical interface
HAProxyLoginserverHostname =
# Specified Port of HaProxy
# let's say they redirect from their port 2121 to your 2106. Then you need to specify 2121 here)
# You should also set LoginserverPort = -1
HAProxyLoginserverPort = -1
# ===============================================================

# Successful logining from logging into the database
LoginLog = true

# Check server status LS/GS connection - ping game server
# Time between pings, in seconds, 0 - disable
GameServerPingDelay = 30
# The maximum number of failed attempts to ping beyond which, the connection to the game server is interrupted
GameServerPingRetry = 4

#-------------------------------------------------------------
# Settings server reboot
#-------------------------------------------------------------
# Daily auto restart on schedule. The restart in the format of cron.
# If the field is empty, the daily auto restart is disabled
# Example: 0 5 * * *
# (Reinicio diario no formato cron: "minuto hora * * *". Ex.: 0 5 * * * = todo dia as 05:00.
#  Quem esta no jogo nao cai; so quem estiver logando naquele instante tenta de novo.)
AutoRestartAt =

#-------------------------------------------------------------
# Janela do login
#-------------------------------------------------------------
# Janela propria do login (console, metricas, bans e GameServers).
# So abre com area de trabalho; sem tela (VPS Linux) o login segue apenas no console.
EnableServerGui = True
