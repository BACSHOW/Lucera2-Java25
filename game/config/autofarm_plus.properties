# AutoFarm Plus: Counter Attack, Respect Hunt, tipos de farm e Keep Location.
# Roda por cima do AutoFarm nativo (limites de premium/tempo/HWID continuam valendo).

# Botoes enviados para a interface
InterfaceShowAutoFarm = true
InterfaceShowTeleport = true
InterfaceShowSideBar = true
InterfaceShowCounterAttack = true
InterfaceShowRespectHunt = true
InterfaceShowAutoSkill = true

# Counter Attack: reage a quem ataca o jogador enquanto ele farma
AutoFarmCounterAttackDefault = false
AutoFarmCounterAttackResumeSeconds = 5
AutoFarmCounterAttackMaxDistance = 1500
AutoFarmCounterAttackChaseDistance = 700

# Respect Hunt: nao rouba o monstro que outro jogador ja esta batendo
AutoFarmRespectHuntDefault = true
AutoFarmRespectClaimTimeoutSeconds = 5

# Intervalos internos (ms)
InterfaceFeatureSyncDelayMs = 1000
AutoFarmWrapperCheckMs = 250

# ---- Offline Hunting ----
# Permite o jogador clicar no botao Offline e continuar farmando deslogado.
# Requer AutoFarmUiPackets = true para o botao aparecer.
OfflineHuntingEnabled = True
InterfaceShowOfflineHunting = true
AutoFarmUiPackets = true