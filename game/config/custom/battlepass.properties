#-------------------------------------------------------------
# Battle Pass (janela L2PassWnd do cliente)
# Abrir: .pass ou .battlepass
# Depois de mudar: reinicie, recarregue os scripts ou use .passreload (GM).
# Acentos: o arquivo e lido em ISO-8859-1; escreva o codigo do caractere
# (ã = a com til, ç = c cedilha, é = e agudo...).
#-------------------------------------------------------------

# Liga / desliga (desligado: ninguem ganha pontos e a janela nao abre).
BattlePassEnabled = True

# Temporada: comeca em SeasonStart e dura SeasonDays dias; depois comeca a
# proxima sozinha (mesma duracao). Quando a temporada vira, pontos, premium
# e recompensas zeram (o que nao foi pego se perde).
# SeasonDays = 0: temporada sem fim (nunca zera).
# Formato da data: AAAA-MM-DD HH:MM (horario do servidor).
SeasonStart = 2026-10-01 00:00
SeasonDays = 30

# Pontos por monstro morto (morte pelo pet / summon conta para o dono).
#   PointsMonster   monstro comum
#   PointsChampion  champion
#   PointsRaid      raid boss
#   PointsBoss      grand boss (Antharas, Valakas...)
PointsMonster = 1
PointsChampion = 3
PointsRaid = 50
PointsBoss = 100

# Monstro com nivel abaixo de (nivel do jogador - MaxLevelDiff) nao da pontos
# (evita farmar monstro cinza). 0 = sem limite.
MaxLevelDiff = 9

# Nivel minimo do jogador para ganhar pontos.
MinLevel = 1

# Party: True = cada membro vivo a ate PartyRange do monstro ganha os pontos
# (o limite de nivel vale para cada um). False = so quem matou.
PartyShare = True
PartyRange = 1500

# Premium: moeda (id do item) e quantidade, cobrada uma vez por temporada.
# Ativo, libera a trilha de baixo (recompensas premium).
# PremiumItemId = 0: premium desligado (o botao avisa que nao esta a venda).
# Padrao: 10 Coin of Luck (4037).
PremiumItemId = 4037
PremiumItemCount = 10

# Recompensa com inventario cheio / peso demais:
#   True  = vai pelo correio (remetente MailSender)
#   False = nao entrega; o jogador libera espaco e tenta de novo
RewardByMailWhenFull = True
MailSender = Battle Pass

# Aviso na tela ao completar um degrau.
StepNotify = True

# Segundos entre gravacoes dos pontos no banco (pegar recompensa e ativar o
# premium gravam na hora; ao sair do jogo tambem grava).
SaveInterval = 60

# Degraus: StepN = pontos ; itemGratis,quantidade ; itemPremium,quantidade
#   - pontos: total acumulado para completar o degrau (sempre maior que o
#     do degrau anterior)
#   - item 0 ou vazio: degrau sem essa recompensa
#   - item que nao empilha (arma, armadura...): no maximo 8
#   - a janela mostra 10 por pagina; mais de 10 degraus = mais paginas
#     (ate 60)
