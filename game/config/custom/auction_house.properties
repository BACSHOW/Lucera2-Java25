# =====================================================================
# AUCTION HOUSE (leilão pela interface)
# Arquivo: config/custom/auction_house.properties
#
# Recarrega sem reiniciar: //reload_config -> "Reload All Configs".
# O que muda vale para os próximos anúncios, lances e compras; os anúncios
# já criados mantêm a moeda e a taxa de criação que pagaram.
# =====================================================================


# =====================================================================
# 1. QUAIS ITENS PODEM SER ANUNCIADOS
# =====================================================================
# Sempre ficam de fora: item que não é negociável (não tradeable), item
# com augment, item de sombra, item temporário, item equipado e o item de
# TicketMarkePlace (abaixo).

# Restringe armas, armaduras e joias por grade.
#   True  = só entram as grades de GradeItemsMarketPlace
#   False = qualquer grade
# Os outros itens (materiais, pergaminhos, poções...) não têm grade e
# nunca são barrados por esta regra.
EnableGradeItemsMarket = True

# Grades aceitas quando EnableGradeItemsMarket = True, separadas por ";".
# Valores: NONE (sem grade), D, C, B, A, S
# Exemplo, só A e S:  GradeItemsMarketPlace = A;S
GradeItemsMarketPlace = NONE;D;C;B;A;S

# Ids de armas/armaduras/joias que entram mesmo fora das grades acima,
# separados por vírgula. 0 = nenhum.
# Exemplo: ItemNoBlockMarketPlace = 6611,6612
ItemNoBlockMarketPlace = 0

# Id de um item que NUNCA pode ser anunciado (usado para a moeda/ticket
# do leilão não ser vendido dentro dele). 0 = nenhum.
TicketMarkePlace = 6392


# =====================================================================
# 2. MOEDAS
# =====================================================================

# Ids das moedas aceitas como pagamento, separados por vírgula. O vendedor
# escolhe uma delas ao criar o anúncio; lances e compra são nessa moeda.
#   57   = Adena
#   3470 = Gold Bar
#   6392 = Event - Medal
# O console mostra as moedas carregadas ("=== CONFIGURAÇÃO DE MOEDAS ===");
# no //reload_config com o nome, e avisa se um id não existir.
MarketplaceCurrencies = 57,3470,6392


# =====================================================================
# 3. TAXAS
# =====================================================================

# Taxa para CRIAR o anúncio: id do item, quantidade.
# É cobrada na hora de anunciar e não volta se o anúncio for cancelado
# ou terminar sem venda. 0,0 = sem taxa de criação.
# Exemplo, 10 Adena por anúncio:  CBBMarketPlaceFee = 57,10
CBBMarketPlaceFee = 57,10

# Taxa sobre a VENDA, descontada do que o vendedor recebe (decimal).
#   0.05 = 5%   0.10 = 10%   0 = sem taxa
# Arredonda para baixo: 5% de 1 Gold Bar = 0 (o vendedor recebe 1);
# 5% de 20 = 1 (recebe 19). A janela de criar mostra "Você recebe ...".
AuctionTaxRate = 0.05


# =====================================================================
# 4. LIMITES DA ABA "CRIAR LEILÃO"
# =====================================================================

# Máximo de anúncios ATIVOS por personagem. 0 = sem limite.
# Aparece no título da lista: "Meus itens à venda: 3 / 10".
MaxAuctionsPerPlayer = 10

# Linhas por página na lista "Meus itens à venda".
# 12 = o que cabe na altura atual da lista no xdat.
MyAuctionsPerPage = 12


# =====================================================================
# 5. LANCES
# =====================================================================

# Lance mínimo = lance atual + X% (arredonda para cima, no mínimo +1).
# Sem nenhum lance, o mínimo é o preço inicial. 0 = lance atual + 1.
# Também define a menor compra imediata aceita: preço inicial + X%.
MinBidIncreasePercent = 5

# Anti-sniping: um lance nos últimos AntiSnipeMinutes minutos faz o leilão
# passar a terminar em (agora + AntiSnipeExtendMinutes minutos), para quem
# foi superado ter tempo de responder. 0 em qualquer um = desligado.
AntiSnipeMinutes = 5
AntiSnipeExtendMinutes = 5


# =====================================================================
# 6. ANÚNCIOS NO CHAT
# =====================================================================

# Anuncia para o servidor todo cada leilão criado
# ("Fulano adicionou +12 Saint Spear Haste no leilão. Lance inicial: ...").
# Com o item no chat ligado (item_link.properties), o nome do item vem com
# o ícone: quem clica vê o tooltip completo.
#   True  = anuncia
#   False = não anuncia (o leilão aparece só na janela do leilão)
AuctionAnnounceCreate = True

# Anuncia para o servidor todo cada lance e cada compra
# ("Fulano deu lance de ... em ...", "Fulano comprou ...").
#   True  = anuncia
#   False = só os envolvidos recebem os avisos (vendedor, licitantes,
#           comprador). Com muitos jogadores online, False evita spam.
AuctionAnnounceBids = True
