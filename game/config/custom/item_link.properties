# =====================================================================
# ITEM NO CHAT (shift+clique no item)
# Arquivo: config/custom/item_link.properties
#
# Shift+clique num item do inventário põe o nome dele no chat com um
# ícone; quem clica no ícone vê o tooltip do item (enchant, augment...).
# Precisa do ChatWnd/ItemLinkWnd novos na interface do cliente.
#
# Recarrega sem reiniciar: //reload_config -> "Reload All Configs".
# =====================================================================

# Liga o sistema.
#   True  = shift+clique cria o link com ícone
#   False = a interface volta ao texto simples "Nome (quantidade)"
ItemLinkEnabled = True

# Quantos links o servidor guarda ao mesmo tempo. Lotado, sai o mais
# antigo (o link dele passa a avisar "expirado"). De 128 a 65536.
ItemLinkCacheEntries = 4096

# Por quanto tempo (segundos) um link pode ser aberto depois de criado.
# 3600 = 1 hora. De 60 a 86400.
ItemLinkLifetimeSeconds = 3600
