#-------------------------------------------------------------
# nao vem no arquivo: para desligar, acrescente AllowMail = False la).
# Depois de mudar: reinicie, recarregue os scripts ou use .correioreload (GM).
# Acentos: o arquivo e lido em ISO-8859-1, entao escreva o codigo do
# caractere: \u00e3 = a com til, \u00f5 = o com til, \u00e7 = c cedilha,
# \u00e1 = a agudo, \u00e9 = e agudo, \u00ed = i agudo, \u00f3 = o agudo.
#-------------------------------------------------------------
# Liga/desliga o correio. Depois de mudar: reinicie, recarregue os scripts ou use .correioreload (GM).
# Ativar Mail
AllowMail = True

# Postagem em Adena: base + valor por anexo. A Adena enviada (campo do saco)
# conta como 1 anexo. Ex.: 3 itens + Adena = 100 + 4 x 1000 = 4100.
MailFeeBase = 100
MailFeePerItem = 1000

# Itens por correio (1 a 8). A Adena vai no campo proprio e nao ocupa slot.
MailMaxAttachments = 8

# Tamanho do assunto (8 a 80; a coluna do banco e tinytext) e do texto
# (0 a 1000), em caracteres.
MailMaxTopic = 64
MailMaxBody = 500

# Correios recebidos guardados por personagem. Caixa cheia = o envio para
# ele e recusado (correio do sistema, como o do leilao, sempre entra).
MailInboxLimit = 240

# Prazos em horas.
#   MailExpireHours         correio normal (360 = 15 dias). Venceu com itens:
#                           volta ao remetente como "[Devolvido]"; sem itens: apagado
#   MailCodExpireHours      cobranca nao paga (12 h): volta ao remetente
#   MailReturnedExpireHours correio devolvido
#   MailSystemExpireHours   correio do sistema (leilao): com itens nunca some,
#                           o prazo e estendido 1 dia por vez
MailExpireHours = 360
MailCodExpireHours = 12
MailReturnedExpireHours = 360
MailSystemExpireHours = 720

# Segundos ate o correio aparecer para quem recebe (0 = na hora). O remetente
# pode cancelar a qualquer momento ate os itens serem retirados.
MailDeliveryDelay = 0

# Zona de paz:
#   MailPeaceZone = True       todo o correio so em zona de paz
#   MailPeaceZoneItems = True  so o que mexe com itens (anexos, Adena, cobranca,
#                              retirar, pagar, cancelar com itens, devolver)
MailPeaceZone = False
MailPeaceZoneItems = True

# Segundos entre dois envios do mesmo personagem (GM nao tem espera).
MailSendCooldown = 5

# Nivel minimo para enviar (1 = sem limite; GM nao tem limite).
MailMinLevel = 1

# Contatos guardados (cada destinatario entra sozinho na lista).
MailMaxContacts = 100

# Leilao pelo correio:
#   True  = compra na hora e lance devolvido vao direto ao inventario quando
#           o jogador esta online e cabe; o resto (leilao vencido, venda,
#           anuncio cancelado ou sem venda), o que nao couber e quem estiver
#           offline chegam como correio de MailAuctionSender.
#   False = como antes (direto no inventario; offline pelo DelayedItems).
# Ligue depois de testar o correio.
MailAuctionDelivery = False
MailAuctionSender = Casa de Leil\u00f5es
