# =====================================================================
# AUCTION HOUSE / MARKETPLACE
# Arquivo de configuração: auction_house.properties
# =====================================================================


# =====================================================================
# 1. MARKETPLACE - SISTEMA GERAL
# =====================================================================

# =====================================================================
# 6. MARKETPLACE - COMMUNITY BOARD
# =====================================================================

# Ativa ou desativa o Auction House/Marketplace através do Community Board.
#
# true  = habilitado
# false = desabilitado
#
EnableCommunityAuction=True


# =====================================================================
# 2. MARKETPLACE - GRADES DE ITENS
# =====================================================================

# Define se o Marketplace deve utilizar restrição por Grade.
# true  = somente as grades configuradas abaixo poderão ser utilizadas
# false = não aplicar essa restrição
EnableGradeItemsMarket=True

# Grades permitidas no Marketplace.
#
# Valores possíveis normalmente:
# NONE;D;C;B;A;S
#
# Separe múltiplas grades utilizando ";"
#
# Exemplo:
# GradeItemsMarketPlace=NONE;D;C;B;A;S
#
GradeItemsMarketPlace=NONE;D;C;B;A;S


# =====================================================================
# 3. MARKETPLACE - ITENS SEM REGRAS
# =====================================================================

# IDs dos itens que poderão ser utilizados no Marketplace
# sem determinadas restrições/regras.
#
# Separe os IDs utilizando vírgula.
#
# Exemplo:
# ItemNoBlockMarketPlace=57,9511,6392
#
# 0,0 = nenhum item específico configurado.
#
ItemNoBlockMarketPlace=0,0


# =====================================================================
# 4. MARKETPLACE - MOEDAS PERMITIDAS
# =====================================================================

# IDs das moedas que podem ser utilizadas como forma de pagamento
# dentro do Marketplace.
#
# Separe os IDs utilizando vírgula.
#
# Exemplos:
# 57   = Adena
# 9511 = moeda customizada
# 6392 = moeda/ticket customizado
#
# Exemplo com múltiplas moedas:
# MarketplaceCurrencies=57,9511,6392
#
MarketplaceCurrencies= 57,3470,6392


# =====================================================================
# 5. MARKETPLACE - TICKET
# =====================================================================

# ID do item utilizado como Ticket do Marketplace.
#
# Mantido para compatibilidade com sistemas que ainda utilizam
# o conceito de Ticket.
#
# Exemplo:
# TicketMarkePlace=6392
#
TicketMarkePlace=6392


# =====================================================================
# 7. MARKETPLACE - COR DA MENSAGEM DE ANÚNCIO
# =====================================================================

# Define a cor/ID utilizada para o anúncio do Auction House
# no chat, dependendo de como o sistema utiliza esse valor.
#
# Exemplo:
# ColorChatAnnuncieAuction=6392
#
ColorChatAnnuncieAuction=6392


# =====================================================================
# 8. MARKETPLACE - TAXA DA LOJA
# =====================================================================

# Configura a taxa cobrada pelo Marketplace.
#
# Formato:
# CBBMarketPlaceFee=VALOR_1,VALOR_2
#
# Os dois valores são carregados pelo código para:
# MARKETPLACE_FEE[0]
# MARKETPLACE_FEE[1]
#
# Exemplo:
# CBBMarketPlaceFee=0,0
#
# Se o seu sistema utilizar os valores como porcentagem/taxa,
# configure conforme a regra implementada no código.
#
CBBMarketPlaceFee=57,10


# =====================================================================
# 9. AUCTION HOUSE - TAXA DO LEILÃO
# =====================================================================

# Porcentagem/taxa cobrada sobre uma operação de leilão.
#
# O valor é decimal.
#
# Exemplos:
#
# 0.05 = 5%
# 0.10 = 10%
# 0.15 = 15%
#
# Valor padrão:
# 0.05 = 5%
#
AuctionTaxRate=0.05


# =====================================================================
# 10. AUCTION HOUSE - QUANTIDADE MÍNIMA DE ITENS
# =====================================================================

# Quantidade mínima de itens utilizada como referência
# para aplicação da taxa do Auction House.
#
# Exemplo:
# AuctionTaxMinimumItemCount=5
#
# Com o valor 5, a regra de taxa mínima será considerada
# a partir de 5 itens, conforme a lógica implementada no servidor.
#
AuctionTaxMinimumItemCount=5

# -----------------------------------------------------------------
# Interface do leilao - aba "Criar leilao"
# -----------------------------------------------------------------
# Maximo de leiloes ATIVOS por personagem. 0 = sem limite.
# Aparece no titulo da lista: "Meus itens a venda: 3 / 10"
MaxAuctionsPerPlayer = 10
 
# Linhas por pagina na lista "Meus itens a venda".
# 11 = o que cabe na altura atual da lista no xdat.
MyAuctionsPerPage = 12
 
# -----------------------------------------------------------------
# Lances (janela "Dar lance")
# -----------------------------------------------------------------
# Lance minimo = lance atual + X% (arredonda para cima, no minimo +1).
# 0 = regra antiga (lance atual + 1). Sem lances, o minimo e o preco inicial.
MinBidIncreasePercent = 5
 
# Anti-sniping: um lance nos ultimos AntiSnipeMinutes faz o leilao
# terminar em (agora + AntiSnipeExtendMinutes). 0 em qualquer um = desligado.
AntiSnipeMinutes = 5
AntiSnipeExtendMinutes = 5