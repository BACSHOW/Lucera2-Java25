#-------------------------------------------------------------
# Network server configuration
#-------------------------------------------------------------
# IP which Bind gameserver * - on all possible
GameserverHostname = *
GameserverPort = 7777
# This is transmitted to the clients connecting from an external network, so it has to be a public IP or resolvable hostname
ExternalHostname = 127.0.0.1
# This is transmitted to the client from the same network, so it has to be a local IP or resolvable hostname
InternalHostname = 127.0.0.1

# Address, port for Login Server communication with GameServer
LoginPort = 9014
LoginHost = 127.0.0.1
LoginUseCrypt = True
# What ID request from of LS
RequestServerID = 1
# Allow to take another id, if requested already in use
AcceptAlternateID = True

#-------------------------------------------------------------
# Database Settings
#-------------------------------------------------------------
DatabaseHost = 127.0.0.1
DatabasePort = 3306
DatabaseName = l2j
DatabaseUser = root
DatabasePassword = nexoral2j
DatabaseMaxConnections = 64
DatabaseConnectionTimeout = 30
# DB additional properties (empty by default)
DatabaseExProperties =
# System of automatic updating of the database structure and its creation in the absence
DatabaseStructureManager = false
# System for automatic creation of a database backup
# Example: * - all tables.
# For individual tables, list like: DatabaseDumpTables = characters, items, clan_data, and etc.
# For disable - Empty
DatabaseDumpTables = *
# Format and directory of SQL dump
DatabaseDumpFilenameFormat = backup/%table_name%_%date%_%time%.sql
# Format and directory of zip dump file
DatabaseDumpZipOutFilenameFormat = backup/%date%_%time%.zip
#-------------------------------------------------------------

# Forced saving character data
Autosave = false
# Forced saving items data 
# Default: False (it is recommended to enable it if threat of incorrect server fall - ddos, energy fault, hardware problems. Increases the load on the DB and server)
AutosaveWithItems = False

#------------------------Client Guards Section-----------------
# default: NONE
# Allowed values: NONE, LAMEGUARD , SMARTGUARD, STRIXGUARD, ActiveAntiCheat
## For enable AdvExt Anti-spam: AdvExtAntispam(746, None), AdvExtAntispam(746, LameGuard), AdvExtAntispam(746, SmartGuard), AdvExtAntispam(746, StrixGuard), AdvExtAntispam(746, ActiveAntiCheat)
AltClientGuard = NONE

# ------------------------ Configuring HaProxy v2 -----------------
# Specified Port of HaProxy
# let's say they redirect from their port 7878 to your 7777. Then you need to specify 7878 here)
# Also you must set the proxy IP to ExternalHostname and GameserverPort = leave blank.
HAProxyGameserverPort = -1

# ------------------------ Netty High Performance Engine -----------
# Enable modern Netty 4 network engine with kernel native transport
# (KQueue on macOS/BSD, Epoll on Linux, NIO portable fallback).
# Default: false (SelectorThread legacy engine)
UseNetty = true
# Number of acceptor boss threads (default: 1)
NettyBossThreads = 1
# Number of I/O worker threads (0 = auto 2x CPU cores)
NettyWorkerThreads = 0
# TCP socket accept backlog
NettySoBacklog = 1024
# Backpressure write watermarks in bytes (low=256KB, high=1MB)
NettyWriteLowWaterMark = 262144
NettyWriteHighWaterMark = 1048576

# ------------------------ LMAX Disruptor Lock-Free RingBuffer ----
# Enables lock-free circular RingBuffer for inbound packet dispatch
# Default: true
UseDisruptor = true
# Optional strict 2D radius filter for objects entering a player's region.
# Keep disabled until validated with live geodata and client visibility settings.
EnableVisibleObjectRadiusFilter = true
VisibleObjectRadius = 3500
# Ativa o pipeline determinístico off-heap Agrona a 120 Hz (8.33ms budget)
EnableDeterministic120HzPipeline = true
# Optional dedicated port for the experimental deterministic pipeline. -1 keeps it disabled.
Deterministic120HzPort = 7778
# RingBuffer size (must be power of 2, default: 65536 = 2^16)
DisruptorRingBufferSize = 65536
# Ativa o pre-warmup da camada de rede e Disruptor antes da abertura das portas públicas
EnableNetworkJitWarmup = true
# Pre-warmup iterations on boot to trigger HotSpot JIT C2 tier-up
# and eliminate cold-start lag before public socket opening (100.000 iteracoes para Tier 4 compilation garantida)
DisruptorWarmupIterations = 100000

#-------------------------------------------------------------
# NPC Spawn Pacing & Network Optimization
#-------------------------------------------------------------
# Ativa o cadenciamento de envio de NpcInfo para evitar micro-freezes no cliente L2 Interlude (UE2.5)
# ao entrar em cidades ou áreas densamente povoadas de monstros/NPCs.
EnableNpcInfoPacing = true
# Quantidade máxima de NPCs despachados instantaneamente (burst imediato)
NpcInfoImmediateBurstLimit = 8
# Intervalo em milissegundos para despacho cadenciado dos lotes subsequentes (default: 40ms)
NpcInfoPacingIntervalMs = 40
# Tamanho de cada lote cadenciado (default: 8 NPCs por lote)
NpcInfoPacedBatchSize = 8
# Ativa coalescing de DeleteObject: se o NPC sumir da visão antes do envio do NpcInfo, cancela ambos da rede
EnableDeleteObjectCoalescing = true
# Janela de reset do burst imediato em milissegundos (default: 150ms)
NpcInfoBurstResetMs = 150

#-------------------------------------------------------------
# Combat DEX Attack Recovery Scaling (Dhousefe Fluid Movement)
#-------------------------------------------------------------
# Ativa o escalonamento fluido do delay de recuperacao de ataque baseado em DEX
# Reduz proporcionalmente o reuse delay para classes com alta DEX (archers/daggers) permitindo stutter-step fluido
EnableDexAttackRecoveryScaling = true
DexAttackRecoveryMinFactor = 0.50
DexAttackRecoveryMaxFactor = 1.15
DexAttackRecoveryBaseDex = 20
DexAttackRecoveryDexDivisor = 45.0
DexAttackRecoveryMaxBonus = 0.45

#-------------------------------------------------------------
# Combat Stat Caps & Balance (L2OFF Dhousefe Compliance)
#-------------------------------------------------------------
# Teto maximo de taxa de critico fisico (default: 500 = 50.0%)
PhysicalCriticalRateCap = 500
# Teto maximo de taxa de critico magico (default: 32.0 = 32.0%)
MagicCriticalRateCap = 32.0
# Teto maximo de taxa de acerto de blow geral de adagas (default: 800 = 80.0%)
BlowRateCapGeneral = 800
# Teto maximo de taxa de acerto de Backstab pelas costas (default: 1000 = 100.0%)
BlowRateCapBackstab = 1000

#-------------------------------------------------------------
# RequestBypassToServer Inbound Flood & DOS Mitigation (Dhousefe)
#-------------------------------------------------------------
# Janela de debounce em milissegundos para comandos idênticos (default: 250ms)
RequestBypassDebounceTimeMs = 250
# Teto maximo de bypasses aceitos por segundo por jogador (default: 15/s)
RequestBypassMaxPacketsPerSecond = 15

#-------------------------------------------------------------
# Fermata protocol extension (opcode 0xFD multiplexer)
#-------------------------------------------------------------
# When enabled, the server advertises its Fermata revision + capability
# bitmask and accepts capability handshake packets from the client. (default: true)
EnableFermataExtensions = true

#-------------------------------------------------------------
# Asynchronous Database & High Performance Persistence (Dhousefe)
#-------------------------------------------------------------
# Habilita escritas assíncronas de HP/MP/CP, posição e status via DatabaseWriterQueue (default: true)
EnableAsyncCharacterUpdates = true

# Habilita suporte e cache ultra-rápido de Geodata com Zstandard (.l2br) (default: true)
EnableZstdGeodataCache = true

#-------------------------------------------------------------
# Char name template
#-------------------------------------------------------------
# Char name. For English only ([0-9A-Za-z]{2,16})
CnameTemplate = ([0-9A-Za-z]{2,16})|([0-9\u0410-\u044f]{2,16})
# Clan name. For English only ([0-9A-Za-z]{3,16})
ClanNameTemplate = ([0-9A-Za-z]{3,16})|([0-9\u0410-\u044f]{3,16})
# Tittle name. For English only ([0-9A-Za-z \\p{Punct}]{1,16})
ClanTitleTemplate = ([0-9A-Za-z \\p{Punct}]{1,16})|([0-9\u0410-\u044f \\p{Punct}]{1,16})
# Ally name. For English only ([0-9A-Za-z]{3,16})
AllyNameTemplate = ([0-9A-Za-z]{3,16})|([0-9\u0410-\u044f]{3,16})
# Forbidden character names to create
ForbiddenCharName = (adm)|(admin)|(nigger)

