#-------------------------------------------------------------
# Random Craft (janelas RandomCraftWndTest / RandomCraftChargingWnd)
# Abrir: .craft ou .randomcraft
# Depois de mudar: reinicie, recarregue os scripts ou use .craftreload (GM).
# Acentos: o arquivo e lido em ISO-8859-1.
#-------------------------------------------------------------

# Liga / desliga.
RandomCraftEnabled = True

# Experiencia de craft: MaxExp de experiencia = 1 Craft Point.
# MaxPoints = teto de Craft Points.
MaxExp = 1000
MaxPoints = 99

# Travas de cada casa (contador "n/20" da janela): sobe 1 a cada vez que a casa e
# travada e mais 1 a cada "Atualizar" com ela travada. Ao chegar em MaxLocks a
# casa nao pode mais ser travada (mesmo que o item dentro mude). Zera ao criar.
MaxLocks = 20
# Quantas casas podem ficar travadas ao mesmo tempo (1 a 5).
MaxLockedSlots = 3

# Atualizar a lista: gasta RefreshPoints Craft Points e o item abaixo.
# Item 0 = nao cobra item. (A primeira lista, com as casas vazias, e gratis.)
RefreshPoints = 1
RefreshItemId = 57
RefreshItemCount = 10000

# Travar uma casa (destravar e gratis; atualizar com ela travada nao cobra de novo).
# Custo = LockItemCount + LockItemStep x (casas que ja estao travadas): a 1a trava custa
# LockItemCount, a 2a LockItemCount + LockItemStep, a 3a + 2 x LockItemStep...
LockItemId = 57
LockItemCount = 5000
LockItemStep = 5000

# Criar: o servidor sorteia uma das 5 casas. Gasta CreatePoints e o item.
CreatePoints = 0
CreateItemId = 57
CreateItemCount = 50000

# Inventario sem espaco / peso: o item vai pelo correio.
RewardByMailWhenFull = True
MailSender = Random Craft

# Pool de recompensas: RewardN = item, quantidade, grau(0-4), peso[, encantamento]
#   grau 3 e 4 brilham na janela e dao aviso na tela quando saem.
#   peso: chance relativa de cair numa casa (maior = mais comum).
#   encantamento: so para item que nao empilha (aqui +0 a +6; os mais altos tem peso menor).
#   Neste arquivo: grau 0 comum, 1 incomum, 2 raro, 3 epico, 4 lendario (so muda o brilho da carta).
#   Limite do pool: 3000 entradas (Reward1 a Reward3000).
# Adena
