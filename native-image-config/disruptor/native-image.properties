# GraalVM native-image build args for the Netty + LMAX Disruptor pipeline.
#
# --initialize-at-build-time: these classes hold no mutable runtime state that
# would break if their <clinit> runs during the build. Initializing them at
# build time trims startup work and avoids runtime class-init checks on the hot
# path. We deliberately do NOT build-init the Disruptor Sequence/Sequencer or
# Netty EventLoop classes — those capture runtime state (threads, offsets) and
# must initialize at run time (GraalVM's default).
Args = --initialize-at-build-time=\
com.lmax.disruptor.util.Util,\
com.lmax.disruptor.SleepingWaitStrategy,\
com.lmax.disruptor.YieldingWaitStrategy,\
com.lmax.disruptor.BlockingWaitStrategy,\
com.lmax.disruptor.LiteBlockingWaitStrategy \
       --initialize-at-run-time=\
io.netty.channel.epoll.Epoll,\
io.netty.channel.epoll.EpollEventLoopGroup,\
io.netty.channel.kqueue.KQueue,\
io.netty.channel.kqueue.KQueueEventLoopGroup
